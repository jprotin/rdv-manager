services:
  emulator:
    build:
      context: .
      dockerfile: emulator/Dockerfile
    ports:
      - "8080:8080"   # Firestore
      - "4000:4000"   # Emulator UI
    volumes:
      - ./firebase.json:/app/firebase.json:ro
      - ./firestore.rules:/app/firestore.rules:ro
      - ./firestore.indexes.json:/app/firestore.indexes.json:ro
      - ./emulator-data:/app/emulator-data
    env_file: ./frontend/.env
    environment:
      FIREBASE_TOKEN: "owner"   # désactive la vérification d'auth pour l'émulateur
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 20s

  frontend:
    image: node:20-alpine
    working_dir: /app
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend_modules:/app/node_modules   # isolé du host pour éviter les conflits
    env_file: ./frontend/.env
    command: sh -c "npm install && npm run dev"
    depends_on:
      emulator:
        condition: service_healthy

volumes:
  frontend_modules:
