name: Deploy — Staging

on:
  push:
    branches:
      - develop

env:
  PROJECT_ID: rdv-manager-staging
  REGION: europe-west1
  SERVICE_NAME: rdv-frontend
  REGISTRY: europe-west1-docker.pkg.dev/rdv-manager-staging/rdv-manager

jobs:
  deploy:
    name: Build, push & deploy staging
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to GCP
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER_STAGING }}
          service_account: ${{ secrets.SA_EMAIL_STAGING }}
          create_credentials_file: true

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Build & push Docker image
        run: |
          IMAGE="${{ env.REGISTRY }}/frontend:${{ github.sha }}"
          docker build \
            --build-arg VITE_FIREBASE_API_KEY="${{ secrets.STAGING_FIREBASE_API_KEY }}" \
            --build-arg VITE_FIREBASE_AUTH_DOMAIN="${{ secrets.STAGING_FIREBASE_AUTH_DOMAIN }}" \
            --build-arg VITE_FIREBASE_PROJECT_ID="${{ env.PROJECT_ID }}" \
            --build-arg VITE_FIREBASE_STORAGE_BUCKET="${{ secrets.STAGING_FIREBASE_STORAGE_BUCKET }}" \
            --build-arg VITE_FIREBASE_MESSAGING_SENDER_ID="${{ secrets.STAGING_FIREBASE_MESSAGING_SENDER_ID }}" \
            --build-arg VITE_FIREBASE_APP_ID="${{ secrets.STAGING_FIREBASE_APP_ID }}" \
            -t "$IMAGE" \
            ./frontend
          docker push "$IMAGE"

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy ${{ env.SERVICE_NAME }} \
            --image="${{ env.REGISTRY }}/frontend:${{ github.sha }}" \
            --region=${{ env.REGION }} \
            --project=${{ env.PROJECT_ID }} \
            --quiet

      - name: Deploy Firestore rules & indexes
        run: |
          npm install -g firebase-tools@latest
          firebase deploy \
            --only firestore:rules,firestore:indexes \
            --project=${{ env.PROJECT_ID }} \
            --non-interactive
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ steps.auth.outputs.credentials_file_path }}

      - name: Get staging URL
        run: |
          URL=$(gcloud run services describe ${{ env.SERVICE_NAME }} \
            --region=${{ env.REGION }} \
            --project=${{ env.PROJECT_ID }} \
            --format='value(status.url)')
          echo "### Staging déployé" >> $GITHUB_STEP_SUMMARY
          echo "URL : $URL" >> $GITHUB_STEP_SUMMARY
          echo "Commit : \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
