name: CI — Build check

on:
  pull_request:
    branches:
      - develop
      - main

jobs:
  build:
    name: Vite build check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Build
        run: npm run build
        working-directory: frontend
        env:
          VITE_FIREBASE_API_KEY: ci-check
          VITE_FIREBASE_AUTH_DOMAIN: ci-check
          VITE_FIREBASE_PROJECT_ID: ci-check
          VITE_FIREBASE_STORAGE_BUCKET: ci-check
          VITE_FIREBASE_MESSAGING_SENDER_ID: ci-check
          VITE_FIREBASE_APP_ID: ci-check
